name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Mondays at 2 AM UTC
    - cron: '0 2 * * 1'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Scan tracked files for committed secrets
      run: python scripts/guard.py
    
    - name: Install Python dependencies
      run: |
        cd backend
        pip install -r ../requirements.txt
        pip install -r requirements-dev.txt
        pip install safety bandit
    
    - name: Run Safety (Python dependency scan)
      run: |
        cd backend
        safety check --json > safety-report.json
        safety check
      # BLOCKING: no known vulnerabilities in runtime dependencies as of the
      # 2026-07-27 audit (paramiko/setuptools patched). A new finding here
      # means a dependency needs a version bump or an explicit, reviewed
      # ignore — not a silent pass-through.

    - name: Run Bandit (Python security linting) — fails on Medium/High
      run: |
        cd backend
        # JSON artifact first, non-blocking (upload step below reads it
        # regardless of pass/fail); the second call is what actually gates.
        bandit -r app/ -f json -o bandit-report.json -ll || true
        bandit -r app/ -ll
      # BLOCKING at Medium+/High severity (the `-ll` threshold). Low-severity
      # findings still run (see summary step) but don't block merges yet —
      # triage backlog, not zero. All Medium/High findings as of 2026-07-27
      # are fixed or narrowly `# nosec`'d with a justification comment inline.

    - name: Bandit Summary
      if: always()
      run: |
        cd backend
        if [ -f bandit-report.json ]; then
          echo "## Bandit Security Scan Results" >> $GITHUB_STEP_SUMMARY
          python -c "import json; f=open('bandit-report.json'); d=json.load(f); f.close(); print(f\"Total issues: {d.get('metrics', {}).get('_totals', {}).get('SEVERITY.HIGH', 0) + d.get('metrics', {}).get('_totals', {}).get('SEVERITY.MEDIUM', 0)}\")" >> $GITHUB_STEP_SUMMARY || echo "Could not parse bandit report" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Node.js dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run npm audit (production dependencies) — blocking
      run: |
        cd frontend
        npm audit --omit=dev --audit-level=moderate
      # BLOCKING for production dependencies (0 known vulnerabilities as of
      # 2026-07-27 — next/sharp patched, sharp pinned via package.json
      # "overrides" since next only allows non-major sharp bumps itself).
      # --omit=dev excludes devDependencies (eslint/typescript-eslint's
      # minimatch chain) — those aren't shipped to users; track separately,
      # don't let lint-tooling churn block ships.

    - name: Run npm audit (all dependencies, informational)
      run: |
        cd frontend
        npm audit --audit-level=moderate
      continue-on-error: true

    - name: Run Unit Tests
      run: |
        cd backend
        pytest tests/ -v --tb=short
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          backend/safety-report.json
          backend/bandit-report.json
        retention-days: 30

